# Unit tests, vet, and lint for the module. The integration suite needs a real
# FileMaker Server and is not run here; the `integration` build tag is still
# vetted and linted so integration_test.go cannot silently stop compiling.
#
# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) keeps
# the pins and their version comments current.

name: Go

on:
  push:
    branches: [ "v4" ]
  pull_request:
    branches: [ "v4" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test:
    name: test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (keep in sync with the go directive in
        # go.mod) and the latest release.
        go: [ '1.21', 'stable' ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
        # The module has no dependencies (no go.sum), so there is nothing to cache.
        cache: false

    - name: Vet
      run: go vet ./...

    - name: Vet integration suite
      run: go vet -tags=integration ./...

    - name: Test
      run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Pinned, not `stable`: golangci-lint can only analyze code for Go versions
    # up to the one its binary was built with (v2.14.0 is built with Go 1.27),
    # so a new Go release would break this job without any source change.
    # Dependabot does not bump either version; bump them together.
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'
        cache: false

    - name: gofmt
      run: |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$out"
          gofmt -d .
          exit 1
        fi

    # Bump together with the lint job's go-version above.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.14.0
